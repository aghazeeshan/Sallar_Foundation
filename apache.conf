<VirtualHost *:80>
    ServerName sallarfoundation.org
    ServerAlias www.sallarfoundation.org
    DocumentRoot /var/www/html/sallarfoundation
    
    <Directory /var/www/html/sallarfoundation>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>
    
    ErrorLog ${APACHE_LOG_DIR}/sallarfoundation.org-error.log
    CustomLog ${APACHE_LOG_DIR}/sallarfoundation.org-access.log combined
</VirtualHost> 